      - '"artificial intelligence" AND (municipal OR "local government" OR "city government" OR "urban governance")'
      - '"urban artificial intelligence" OR "urban AI" OR "AI urbanism" OR "city brain"'
      - '"generative AI" AND (city OR urban OR "urban planning")'
    screen:
      require: ['algorithm|artificial intelligence|\bai\b|automat|city brain|machine learning|generative', 'city|cities|urban|municipal|local government']
