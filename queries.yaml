      flag: []
  C9:
    domain: C
    name: Digital mobility (ride-hailing, MaaS, digital ticketing, transit apps)
    queries:
      - '"ride-hailing" OR "ride hailing" OR ridesourcing OR "ride-sourcing" OR ridesharing AND urban'
      - '"mobility as a service" OR "mobility-as-a-service" OR MaaS AND transport'
      - '("transit app" OR "journey planner" OR "real-time information" OR "smart card") AND (transit OR "public transport")'
      - '("digital ticketing" OR "mobile ticketing" OR "fare integration" OR "contactless payment") AND transit'
