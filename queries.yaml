    queries:
      - '"smart urbanism" OR "actually existing smart city" OR "Smart Cities Mission"'
      - '("smart city" OR "smart cities") AND (critical OR governance OR citizens OR citizenship OR neoliberal OR corporate)'
      - '"smart city" AND (policy OR politics OR urbanism)'
    screen:
      require: ['smart cit|smart urbanism']
      flag: []
  C2:
    domain: C
    name: Platform urbanism
    queries:
      - '"platform urbanism" OR "platform urbanisation" OR "platform urbanization" OR "platform cities"'
      - '(platformization OR platformisation) AND (city OR cities OR urban)'
      - '"digital platforms" AND (city OR cities OR urban) AND (governance OR space OR labour OR labor OR housing OR regulation)'
    screen:
      require: ['platform|airbnb|uber|ride-?hail|delivery app', 'urban|city|cities|municipal|neighbou?rhood|street|metropol']
      flag: ['\b(urban data platform|iot platform|platform architecture|middleware|interoperab)\w*']
  C3:
    domain: C
    name: Digital geographies & code/space
    queries:
      - '"digital geographies" OR "digital geography"'
      - '"code/space" OR "software-sorted" OR "software and space" OR "coded space"'
      - '"spatial media" OR geoweb OR "locative media"'
      - '"digital turn" AND geography'
    screen:
      require: ['digital geograph|code/space|software|spatial media|geoweb|locative|digital turn']
      flag: []
  C4:
    domain: C
    name: Urban informatics & urban computing
    queries:
      - '"urban informatics" OR "urban computing"'
      - '"urban analytics" OR "urban science" AND data'
      - '"urban big data" OR ("big data" AND (city OR urban) AND (planning OR mobility OR governance))'
      - '"city dashboards" OR "urban dashboards" OR "city dashboard"'
    screen:
      require: ['informatics|urban computing|analytics|urban science|big data|dashboard|data']
      flag: []
  C5:
    domain: C
    name: Urban data governance & data justice in cities
    queries:
      - '"urban data" AND (governance OR justice OR ownership OR commons OR sovereignty)'
      - '"data governance" AND (city OR cities OR municipal OR urban)'
      - '"open data" AND (city OR cities OR municipal) AND (government OR governance OR transparency)'
      - '("data commons" OR "data trust" OR "technological sovereignty" OR "digital sovereignty") AND (city OR urban)'
      - '"data justice" AND (city OR urban)'
    screen:
      require: ['data', 'city|cities|urban|municipal']
      flag: []
  C6:
