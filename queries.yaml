      - '"gig economy" OR "gig work" OR "gig workers"'
      - '"platform work" OR "platform workers" OR "platform labour" OR "platform labor"'
      - 'crowdwork OR "crowd work" OR microwork OR "online labour" OR "algorithmic management"'
    screen:
      require: ['labou?r|work|gig|crowd|employment']
      flag: []
  B12:
    domain: B
    name: Infrastructure studies & STS of digital systems
    queries:
      - '"infrastructure studies" OR infrastructuring OR "information infrastructure" AND sociotechnical'
      - '"digital infrastructure" AND (politics OR power OR sociotechnical OR "science and technology studies")'
      - '"sociotechnical imaginaries" OR "socio-technical imaginaries"'
      - '"science and technology studies" AND digital AND infrastructure'
    screen:
      require: ['infrastructur|imaginar|sociotechnical|socio-technical']
      flag: []
  B13:
    domain: B
    name: Mobile phones & everyday digital life
    queries:
      - '("mobile phone" OR "mobile phones" OR "cell phone" OR smartphone) AND ("everyday life" OR everyday OR gender) NOT (addiction OR "problematic smartphone use")'
      - 'ICT4D OR ICTD OR ("mobile communication" AND development)'
      - '"mobile internet" AND (users OR everyday OR rural OR women)'
    screen:
      require: ['mobile|phone|smartphone|ict4d|ictd']
      flag: ['\b(addiction|problematic use|nomophobia|app for (diabetes|hiv))\b']
  B14:
    domain: B
    name: Generative AI & society
    queries:
      - '"generative AI" OR "generative artificial intelligence"'
      - '(ChatGPT OR "large language models" OR "large language model") AND (society OR labour OR labor OR policy OR ethics OR governance)'
      - '"foundation models" AND (society OR power OR governance)'
    screen:
      require: ['generative|chatgpt|large language model|llm|foundation model|gpt']
      flag: []

  # ------------------------------------------------------------------ C. Urban × digital
  C1:
