# Search strategy for the literature map. See BRIEF.md §3.
#
# Each theme has 2–5 query strings in OpenAlex search syntax (Boolean AND/OR/NOT, "quoted
# phrases"). They run in mode = exact (no stemming, so plural/spelling variants are listed
# explicitly): stemmed phrases in OpenAlex keyword mode only need the words to co-occur, which
# pulled in tens of thousands of off-topic works in testing. Searches cover title, abstract and
# the OpenAlex keywords a phrase names (search_in = title_abstract_keywords). For each slice
# the theme's queries are OR-ed into one search:
#
#   landmarks : (q1) OR (q2) ...                         sort = cited_by_count, top 50
#   recent    : same, publication year 2022–2026         sort = relevance (reranked), top 50
#   india     : ((q1) OR (q2) ...) AND (south_asia_terms) sort = relevance (reranked), top 50
#
# `screen` holds the rule-based relevance filter applied to title + abstract + keywords
# (scripts/screen.py): every regex group in `require` must match; a match on any
# `flag` regex (plus the global flags below) sends the record to manual review.
# Regexes are case-insensitive Python syntax.

version: 1

mode: exact

slices:
  landmarks: {sort: cited_by_count, limit: 50}
  recent: {sort: relevance, from_year: 2022, to_year: 2026, limit: 50}
  india: {sort: relevance, limit: 50}

south_asia_terms: >-
  India OR Indian OR Delhi OR Mumbai OR Bombay OR Bangalore OR Bengaluru OR Chennai OR
  Kolkata OR Calcutta OR Hyderabad OR Pune OR Ahmedabad OR Gurgaon OR Gurugram OR Noida OR
  Haryana OR Kerala OR Bangladesh OR Dhaka OR Pakistan OR Karachi OR Lahore OR Nepal OR
  Kathmandu OR "Sri Lanka" OR Colombo OR Bhutan OR Maldives OR Afghanistan OR Kabul OR
  "South Asia" OR "South Asian"

# Flags applied to every theme (technical / biomedical noise). A flagged record that passes
# `require` goes to manual review rather than being dropped automatically.
global_flags:
  - '\b(deep learning|neural network|convolutional|reinforcement learning|transformer model|lstm|svm|random forest)\b'
  - '\b(sensor network|wireless|5g|6g|edge computing|fog computing|cloud computing|iot architecture|protocol|latency|throughput|encryption scheme|authentication scheme)\b'
  - '\b(patients?|clinical|randomi[sz]ed|prevalence of|mortality|disease|infection|vaccin\w*|tubercul\w*|malaria)\b'

themes:
  # ------------------------------------------------------------------ A. Urban
  A1:
    domain: A
    name: Urban governance, decentralisation & municipal finance
    queries:
      - '"urban governance"'
      - '"municipal finance" OR "municipal fiscal" OR "local government finance" OR "municipal bonds" OR "property tax" AND municipal'
      - '(decentralization OR decentralisation) AND (municipal OR "urban local bodies" OR "local government" OR city)'
      - '"74th Amendment" OR "urban local bodies" OR "municipal corporation" OR "city government"'
    screen:
      require: ['urban|city|cities|municipal|metropolitan|local government|local bodies']
      flag: []
  A2:
    domain: A
    name: Planning, master plans & land-use regulation
    queries:
      - '"master plan" AND (city OR urban)'
      - '"land use regulation" OR "land-use regulation" OR zoning AND (urban OR city OR housing)'
      - '"urban planning" AND (policy OR regulation OR state OR politics)'
      - '"development control" OR "planning regulation" OR "building regulations" OR "planning law"'
    screen:
      require: ['plan|zoning|land[- ]use|regulat|development control']
      flag: []
  A3:
    domain: A
    name: Housing, informality & slums
    queries:
      - 'slum OR slums OR "informal settlement" OR "informal settlements"'
      - '"urban informality"'
      - '"affordable housing" OR "housing policy" OR "public housing" OR "social housing"'
      - '"self-help housing" OR "slum upgrading" OR "slum redevelopment" OR "sites and services"'
    screen:
      require: ['hous|slum|informal settlement|informality|shelter|tenure']
      flag: []
  A4:
    domain: A
    name: Eviction, resettlement & displacement
    queries:
      - 'eviction OR evictions OR "forced eviction"'
      - 'resettlement AND (urban OR slum OR city OR "informal settlement")'
      - '"development-induced displacement" OR (displacement AND gentrification)'
      - 'demolition AND (slum OR "informal settlement" OR squatter)'
    screen:
      require: ['evict|resettle|displace|demoli|relocat']
      flag: ['\b(refugee camp|conflict-induced|internally displaced persons)\b']
  A5:
    domain: A
    name: Land, peri-urban & extended urbanisation
    queries:
      - '"peri-urban" OR periurban OR "peri-urbanisation" OR "peri-urbanization"'
      - '"extended urbanization" OR "extended urbanisation" OR "planetary urbanization" OR "planetary urbanisation"'
      - '"urban land" AND (acquisition OR market OR conversion OR speculation)'
      - '"land acquisition" OR "land pooling" OR "special economic zone" OR "land grab" AND urban'
      - '"urban fringe" OR "rural-urban fringe" OR desakota'
    screen:
      require: ['peri-?urban|extended urbani|planetary urbani|land|fringe|desakota']
      flag: ['\b(soil|crop yield|remote sensing|land surface temperature|ndvi)\b']
  A6:
    domain: A
    name: Small towns, census towns & secondary cities
    queries:
      - '("small towns" OR "small town") AND (urban OR urbanisation OR urbanization)'
      - '"census towns" OR "census town"'
      - '"secondary cities" OR "secondary city" OR "intermediate cities" OR "medium-sized cities" OR "second-tier cities"'
      - '"subaltern urbanization" OR "subaltern urbanisation" OR "small and medium towns"'
    screen:
      require: ['small towns?|census towns?|secondary cit|intermediate cit|medium-sized cit|second-tier|subaltern urbani|small and medium']
      flag: []
  A7:
    domain: A
    name: Urban infrastructure (water, sanitation, energy) & infrastructural citizenship
    queries:
      - '"urban water" AND (governance OR politics OR access OR supply OR inequality)'
      - 'sanitation AND (urban OR city OR slum) AND (politics OR governance OR access)'
      - '"infrastructural citizenship" OR "hydraulic citizenship" OR "infrastructural violence" OR "splintering urbanism"'
      - '"urban infrastructure" AND (politics OR governance OR everyday OR citizenship)'
      - '(electricity OR "energy access") AND (slum OR "informal settlement" OR urban poor)'
    screen:
      require: ['water|sanitation|toilet|sewer|electric|energy|infrastructur', 'urban|city|cities|slum|settlement|municipal']
      flag: ['\b(wastewater treatment plant|membrane|pipe network model|hydraulic model)\b']
  A8:
    domain: A
    name: Mobility & transport (social science)
    queries:
      - '"urban mobility" AND (social OR equity OR justice OR everyday OR politics)'
      - '"transport equity" OR "transport justice" OR "transport disadvantage" OR "mobility justice" OR "transport poverty"'
      - '"public transport" AND (gender OR women OR informal OR everyday OR politics)'
      - 'paratransit OR "informal transport" OR "auto-rickshaw" OR "minibus taxi" OR matatu'
      - '"mobilities" AND (urban OR city) AND (social OR everyday)'
    screen:
      require: ['mobilit|transport|transit|commut|travel|paratransit|rickshaw|bus\b|metro|rail']
      flag: ['\b(traffic flow|vehicle routing|optimi[sz]ation model|signal control|demand forecasting)\b']
  A9:
    domain: A
    name: Public space, publicness & the street
    # v2 (pilot): bare "publicness" and "the street" pulled in public-management and generic
    # sociology works (67k hits); both now need a spatial/urban co-term.
    queries:
      - '("public space" OR "public spaces") AND (urban OR city OR cities OR street OR streets)'
      - '"urban publicness" OR (publicness AND ("public space" OR "public spaces" OR urban OR city))'
      - '"everyday urbanism" OR ("street life" AND (urban OR city)) OR (sidewalk AND "public space")'
      - '"privatization of public space" OR "privatisation of public space" OR "privately owned public space" OR "privately owned public spaces" OR "pseudo-public"'
      - '"right to the city" AND ("public space" OR street OR streets)'
    screen:
      require: ['public space|publicness|street|sidewalk|plaza|square|park|public realm']
      flag: ['\b(thermal comfort|microclimate|air quality|pm2\.5|noise level|obesity|physical activity)\b']
  A10:
    domain: A
    name: Urban economy, informal work & street vending
    queries:
      - '"street vending" OR "street vendors" OR "street hawkers" OR hawkers OR "street trading"'
      - '"informal economy" AND (urban OR city OR cities)'
      - '"informal sector" AND urban AND (workers OR livelihoods OR employment)'
      - '"waste pickers" OR "home-based workers" OR "informal workers" AND city'
      - '"urban informal economy" OR "urban livelihoods"'
    screen:
      require: ['vend|hawker|street trad|informal (economy|sector|work|employment)|waste picker|home-based|livelihood']
      flag: []
  A11:
    domain: A
    name: Migration & the city
    queries:
      - '"rural-urban migration" OR "rural–urban migration" OR "internal migration" AND (city OR urban)'
      - '"urban migrants" OR "migrant workers" AND (city OR urban)'
      - '("circular migration" OR "seasonal migration") AND (urban OR city)'
      - '"urban refugees" OR "arrival city" OR "arrival cities" OR "migrant city"'
    screen:
      require: ['migra|refugee|arrival cit', 'urban|city|cities|metropol']
      flag: []
  A12:
    domain: A
    name: Gender, caste, class & the city
    queries:
      - '"feminist urbanism" OR "gendered city" OR "women and the city" OR "feminist geography" AND city'
      - '("women''s safety" OR "sexual harassment") AND (urban OR city OR "public transport" OR street)'
      - 'caste AND (urban OR city OR cities)'
      - '("residential segregation" OR "spatial segregation") AND (class OR caste OR religion OR Muslim)'
      - '"urban middle class" OR "new middle class" AND city'
    screen:
      require: ['gender|women|feminis|caste|class|segregat|dalit|muslim', 'urban|city|cities|street|transport|neighbou?rhood']
      flag: []
  A13:
    domain: A
    name: Heritage, mega-events & "world-class" city making
    queries:
      - '"mega-events" OR "mega-event" OR "Commonwealth Games" OR "Olympic Games" AND (city OR urban)'
      - '"world-class city" OR "world class city" OR "worlding cities" OR "global city making"'
      - '"urban heritage" OR heritagization OR heritagisation OR "heritage conservation" AND city'
      - '"urban beautification" OR "city branding" OR "urban spectacle" OR "urban renewal" AND spectacle'
    screen:
      require: ['mega-?event|olympic|commonwealth games|world[- ]class|worlding|heritage|beautif|branding|spectacle']
      flag: ['\b(laser scanning|photogrammetry|hbim|point cloud)\b']
  A14:
    domain: A
    name: Urban environment, climate & risk
    queries:
      - '"urban climate governance" OR ("climate change" AND (city OR cities) AND (adaptation OR governance OR justice))'
      - '"urban resilience"'
      - '("urban flooding" OR "urban floods") AND (governance OR vulnerability OR politics)'
      - '"urban political ecology"'
      - '"urban heat" AND (vulnerability OR justice OR inequality)'
    screen:
      require: ['climat|resilien|flood|heat|political ecology|environment|risk|disaster']
      flag: ['\b(remote sensing|land surface temperature|landsat|hydrological model|swmm)\b']
  A15:
    domain: A
    name: Urban & planning theory, Southern urbanism
    queries:
      - '"southern urbanism" OR "southern urban theory" OR "urban theory from the South" OR "ordinary cities"'
      - '"comparative urbanism" OR "postcolonial urbanism" OR "postcolonial urban"'
      - '"planning theory" OR "insurgent planning" OR "occupancy urbanism"'
      - '"urban theory" AND (global OR south OR critique)'
    screen:
      require: ['theor|southern|postcolonial|comparative|ordinary cit|insurgent|occupancy']
      flag: []
  A16:
    domain: A
    name: Night-time city & urban time
    queries:
      - '("night-time economy" OR "nighttime economy" OR "night-time city" OR "urban night" OR nightlife) NOT ("nighttime light" OR "night-time light" OR "night light")'
      - '"urban rhythms" OR rhythmanalysis OR "urban time" OR "urban temporalities"'
      - '(night OR nighttime OR "after dark") AND (women OR safety OR mobility) AND (city OR street OR transport) NOT ("nighttime light" OR "night-time light")'
    screen:
      require: ['night|rhythm|tempora|time']
      flag: ['night-?time lights?|luminosity|viirs|dmsp|sleep']

  # ------------------------------------------------------------------ B. Digital society
  B1:
    domain: B
    name: Platforms & platform capitalism
    queries:
      - '"platform capitalism" OR "platform economy" OR "platform society"'
      - 'platformization OR platformisation'
      - '"digital platforms" AND (power OR governance OR capitalism OR regulation OR monopoly)'
    screen:
      require: ['platform']
      flag: []
  B2:
    domain: B
    name: Datafication, data justice & data colonialism
    queries:
      - 'datafication'
      - '"data justice"'
      - '"data colonialism" OR "digital colonialism" OR "data extractivism"'
      - '"surveillance capitalism" OR "critical data studies"'
    screen:
      require: ['datafi|data justice|colonialism|extractiv|surveillance capitalism|critical data']
      flag: []
  B3:
    domain: B
    name: Surveillance studies
    queries:
      - '"surveillance studies" OR "surveillance society" OR "surveillant assemblage"'
      - 'dataveillance OR "lateral surveillance" OR "social sorting" OR "state surveillance" OR "mass surveillance"'
      - 'surveillance AND privacy AND (digital OR technology) AND (power OR state OR citizens)'
    screen:
      require: ['surveil|dataveillance|social sorting']
      flag: ['\b(disease surveillance|epidemiolog|syndromic|public health surveillance|sentinel)\b']
  B4:
    domain: B
    name: Algorithmic governance & AI in the public sector
    queries:
      - '"algorithmic governance" OR "algorithmic governmentality" OR "algorithmic regulation"'
      - '"automated decision-making" OR "automated decision making" AND (government OR public OR welfare)'
      - '"artificial intelligence" AND ("public sector" OR "public administration" OR "public services")'
      - '"digital welfare state" OR "algorithmic accountability"'
    screen:
      require: ['algorithm|automat|artificial intelligence|\bai\b|machine learning', 'govern|public|welfare|state|administration|policy']
      flag: []
  B5:
    domain: B
    name: Digital identity & digital public infrastructure (DPI)
    queries:
      - 'Aadhaar OR "India Stack" OR "digital public infrastructure" OR "digital public goods"'
      - '("digital identity" OR "digital ID" OR "national ID" OR "foundational identity") AND (state OR citizenship OR welfare OR development OR government)'
      - 'biometric AND (welfare OR citizenship OR identification OR "social protection") AND (state OR government)'
      - '"identification systems" AND (development OR inclusion OR exclusion)'
    screen:
      require: ['aadhaar|digital id|digital identit|national id|identification|biometric|public infrastructure|india stack|public goods|e-?id\b']
      flag: ['\b(fingerprint recognition|iris recognition algorithm|liveness detection|self-sovereign identity scheme|zero-knowledge)\b']
  B6:
    domain: B
    name: Digital finance & payments
    queries:
      - '"mobile money" OR M-Pesa OR MPesa'
      - '"digital payments" OR "digital payment" OR cashless OR demonetisation OR demonetization'
      - '"financial inclusion" AND (digital OR mobile OR fintech)'
      - 'fintech AND (inclusion OR society OR regulation OR households OR poor)'
    screen:
      require: ['mobile money|m-?pesa|payment|cashless|demoneti|financial inclusion|fintech']
      flag: []
  B7:
    domain: B
    name: Digital divides & digital inclusion
    queries:
      - '"digital divide" OR "digital divides" OR "digital inequality" OR "digital inequalities"'
      - '"digital inclusion" OR "digital exclusion"'
      - '"digital literacy" AND (inequality OR inclusion OR exclusion)'
      - '"internet access" AND (inequality OR gap OR rural)'
    screen:
      require: ['divide|inequalit|inclusion|exclusion|literacy|access']
      flag: []
  B8:
    domain: B
    name: Social media, digital publics & political communication
    queries:
      - '"social media" AND ("political communication" OR elections OR "election campaign" OR populism)'
      - '"digital publics" OR "networked publics" OR "digital public sphere" OR "networked public sphere"'
      - '"political participation" AND (online OR "social media")'
      - '"hashtag activism" OR "connective action" OR "digital activism"'
    screen:
      require: ['social media|twitter|facebook|whatsapp|online|digital|networked|hashtag|internet']
      flag: []
  B9:
    domain: B
    name: Misinformation & extreme speech
    queries:
      - 'misinformation OR disinformation OR "fake news"'
      - '"extreme speech" OR ("hate speech" AND (online OR "social media"))'
      - '"computational propaganda" OR "information disorder"'
      - 'WhatsApp AND (misinformation OR rumours OR rumors OR lynching)'
    screen:
      require: ['misinformation|disinformation|fake news|hate speech|extreme speech|propaganda|rumou?r|information disorder']
      flag: ['\b(detection model|classifier|bert|f1[- ]score|dataset for)\b']
  B10:
    domain: B
    name: Cybercrime, fraud & cybersecurity (social science)
    queries:
      - 'cybercrime OR "cyber crime" OR "cyber-crime"'
      - '"online fraud" OR "internet fraud" OR "romance scam" OR "online scams" OR (phishing AND victim)'
      - '(cybersecurity OR "cyber security") AND (policy OR governance OR "human factors" OR behaviour OR behavior OR society)'
      - '"cyber victimization" OR "cyber victimisation" OR "cybercrime victimization"'
    screen:
      require: ['cyber|fraud|scam|phishing']
      flag: ['\b(intrusion detection|malware detection|anomaly detection|attack graph)\b']
  B11:
    domain: B
    name: Digital labour
    queries:
