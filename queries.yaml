# Search strategy for the literature map. See BRIEF.md §3.
#
# Each theme has 2–5 query strings in OpenAlex search syntax (Boolean AND/OR/NOT, "quoted
# phrases"). They run in mode = exact (no stemming, so plural/spelling variants are listed
# explicitly): stemmed phrases in OpenAlex keyword mode only need the words to co-occur, which
# pulled in tens of thousands of off-topic works in testing. Searches cover title, abstract and
# the OpenAlex keywords a phrase names (search_in = title_abstract_keywords). For each slice
# the theme's queries are OR-ed into one search:
#
#   landmarks : (q1) OR (q2) ...                         sort = cited_by_count, top 50
#   recent    : same, publication year 2022–2026         sort = relevance (reranked), top 50
#   india     : ((q1) OR (q2) ...) AND (south_asia_terms) sort = relevance (reranked), top 50
#
# `screen` holds the rule-based relevance filter applied to title + abstract
# (scripts/build_records.py). `require[0]` is the theme's core concept, `require[1:]` are
# context terms; `flag` (+ global_flags unless skip_global_flags) marks technical/biomedical
# noise. Regexes are case-insensitive Python syntax.
#
# Screening rules v3 (Stage 2; calibrated on the 202 Stage 1 hand decisions so that borderline
# cases stay under 25% per theme):
#   include    core in title, or core twice in the abstract, with every context term present;
#              core in title of a record without abstract (confidence low); core in title with
#              context missing (with or without abstract), for A and B themes only
#   borderline core mentioned once in the abstract AND named by an OpenAlex keyword tag;
#              flag match with core in title; stub abstract with core in title
#   exclude    C-theme record with no urban context term and no named city (in C themes the
#              urban term is what makes a work urban x digital; such works belong to B themes;
#              first Stage 2 C run: C6 40% / C15 46% borderline, mostly for this reason);
#              core absent from title and abstract (also when OpenAlex withholds the abstract,
#              e.g. Elsevier, and the search matched text we cannot see: in A1/A2 landmarks 35
#              of 35 such records were off-topic); flag match without core in title; core once in the abstract and
#              not in keyword tags; stub abstract without core in title
# Per-theme tightening (strict_once: true) when a theme's borderline share exceeds 25%: a single
# core mention is reviewed only if it is in the abstract's first two sentences or in a sentence
# stating the work's aim (Stage 1 calibration: 12/25 such records kept vs 15/50 elsewhere).
# Borderline records are decided by hand in data/screening/manual_review.csv; a hand decision
# on a work-theme pair overrides the rules. v2 core terms were revised for the pilot themes
# (C2, A9, B5); v3 core terms for all other themes are theme-specific phrases instead of
# single generic words (e.g. A2 'plan' -> master plan / zoning / planning regulation ...).

version: 2

mode: exact

slices:
  landmarks: {sort: cited_by_count, limit: 50}
  recent: {sort: relevance, from_year: 2022, to_year: 2026, limit: 50}
  india: {sort: relevance, limit: 50}

# Stage 2 (direct API, scripts/run_search.py). Landmarks: one OR-combined search, top 100 by
# citations. Recent / India: one search per query string (so rare phrases cannot dominate an
# OR-combined relevance ranking), per_page = ceil(target / number of queries) within bounds.
slices_stage2:
  landmarks: {per_page: 100}
# A1 ran with target 100 (25 per query); from A2 on the target is 70 to keep the map near the
# brief's 3,000-5,000 records.
  recent: {target: 70, min_per_query: 15, max_per_query: 30}
  india: {target: 70, min_per_query: 15, max_per_query: 30}

south_asia_terms: >-
  India OR Indian OR Delhi OR Mumbai OR Bombay OR Bangalore OR Bengaluru OR Chennai OR
  Kolkata OR Calcutta OR Hyderabad OR Pune OR Ahmedabad OR Gurgaon OR Gurugram OR Noida OR
  Haryana OR Kerala OR Bangladesh OR Dhaka OR Pakistan OR Karachi OR Lahore OR Nepal OR
  Kathmandu OR "Sri Lanka" OR Colombo OR Bhutan OR Maldives OR Afghanistan OR Kabul OR
  "South Asia" OR "South Asian"

# Flags applied to every theme (technical / biomedical noise). A flagged record that passes
# `require` goes to manual review rather than being dropped automatically.
global_flags:
  - '\b(deep learning|neural network|convolutional|reinforcement learning|transformer model|lstm|svm|random forest)\b'
  - '\b(sensor network|wireless|5g|6g|edge computing|fog computing|cloud computing|iot architecture|protocol|latency|throughput|encryption scheme|authentication scheme)\b'
  - '\b(patients?|clinical|randomi[sz]ed|prevalence of|mortality|disease|infection|vaccin\w*|tubercul\w*|malaria)\b'

themes:
  # ------------------------------------------------------------------ A. Urban
  A1:
    domain: A
    name: Urban governance, decentralisation & municipal finance
    queries:
      - '"urban governance"'
      - '"municipal finance" OR "municipal fiscal" OR "local government finance" OR "municipal bonds" OR "property tax" AND municipal'
      - '(decentralization OR decentralisation) AND (municipal OR "urban local bodies" OR "local government" OR city)'
      - '"74th Amendment" OR "urban local bodies" OR "municipal corporation" OR "city government"'
    screen:
      # v3 (Stage 2)
      require: ['urban governance|municipal\w* (finance|fiscal|bonds?|revenues?|budget\w*|government|corporations?|councils?|governance|reform\w*)|local governments?|urban local bodies|decentrali[sz]\w*|property tax\w*|city governments?|74th (constitutional )?amendment|metropolitan governance|intergovernmental (fiscal )?transfers?|local (state|democracy|councils?)', 'urban|city|cities|municipal|metropol\w*|towns?\b|local bod\w*', 'govern\w*|municipal\w*|fiscal|politic\w*|democra\w*|administrat\w*|council\w*|financ\w*|tax\w*|budget\w*|polic(y|ies)|state']
      flag: []
  A2:
    domain: A
    name: Planning, master plans & land-use regulation
    queries:
      - '"master plan" AND (city OR urban)'
      - '"land use regulation" OR "land-use regulation" OR zoning AND (urban OR city OR housing)'
      # v3: v2 ('"urban planning" AND (policy OR regulation OR state OR politics)') let any
      # abstract that mentions urban planning in passing into the landmark slice
      - '"urban planning" AND (planners OR "planning system" OR "planning systems" OR "planning practice" OR "planning policy" OR "planning politics" OR "politics of planning" OR "planning regime")'
      - '"development control" OR "planning regulation" OR "building regulations" OR "planning law"'
    screen:
      # v3 (Stage 2)
      require: ['master ?plans?|urban planning|land[- ]use (regulation|planning|plans?|controls?|zoning)|zoning|development (control|plans?|regulations?)|planning (regulations?|law|systems?|polic\w*|practices?|permission|authorit\w*|process\w*)|building (regulations?|codes?|bye?-?laws?)|spatial planning|town planning|city planning|planners', 'urban|city|cities|municipal|metropol\w*|towns?\b|housing|land']
      flag: ['\b(cellular automata|land[- ]use change model\w*|landsat|remote sensing|markov chain|sleuth|flus model|land surface temperature)\b']
  A3:
    domain: A
    name: Housing, informality & slums
    queries:
      - 'slum OR slums OR "informal settlement" OR "informal settlements"'
      - '"urban informality"'
      - '"affordable housing" OR "housing policy" OR "public housing" OR "social housing"'
      - '"self-help housing" OR "slum upgrading" OR "slum redevelopment" OR "sites and services"'
    screen:
      # v3 (Stage 2)
      require: ['slums?\b|informal settlements?|urban informality|squatt\w*|shanty ?towns?|favelas?|affordable housing|housing polic\w*|public housing|social housing|self-help housing|sites and services|bastis?\b|jhuggi\w*|chawls?|housing (informality|tenure|rights|markets?|crisis|affordability|provision|programmes?|programs?|schemes?)|tenure security|rental housing|low-income housing', 'urban|city|cities|municipal|metropol\w*|towns?\b|slums?|settlements?|housing']
      flag: []
  A4:
    domain: A
    name: Eviction, resettlement & displacement
    queries:
      # v3: bare 'eviction' also matched cache eviction (computing); now needs a housing co-term
      - '(eviction OR evictions OR "forced eviction") AND (housing OR tenants OR tenant OR rental OR landlord OR landlords OR urban OR city OR slum)'
      - 'resettlement AND (urban OR slum OR city OR "informal settlement")'
      - '"development-induced displacement" OR (displacement AND gentrification)'
      - 'demolition AND (slum OR "informal settlement" OR squatter)'
    screen:
      # v3 (Stage 2)
      require: ['evict\w*|resettle\w*|displace\w*|demoli\w*|relocat\w*|gentrif\w*|dispossess\w*', 'urban|city|cities|slums?|informal settlements?|housing|neighbou?rhoods?|tenants?|squatt\w*|gentrif\w*|municipal|metropol\w*']
      flag: ['\b(refugee camps?|conflict-induced|internally displaced persons|displacement (sensor|field|transducer)|seismic|landslides?|structural displacement|displacement ventilation)\b']
  A5:
    domain: A
    name: Land, peri-urban & extended urbanisation
    queries:
      - '"peri-urban" OR periurban OR "peri-urbanisation" OR "peri-urbanization"'
      - '"extended urbanization" OR "extended urbanisation" OR "planetary urbanization" OR "planetary urbanisation"'
      - '"urban land" AND (acquisition OR market OR conversion OR speculation)'
      - '"land acquisition" OR "land pooling" OR "special economic zone" OR "land grab" AND urban'
      - '"urban fringe" OR "rural-urban fringe" OR desakota'
    screen:
      # v3 (Stage 2)
      require: ['peri-?urban\w*|extended urbani[sz]ation|planetary urbani[sz]ation|urban fringes?|rural[- ]urban fringe|desakota|urban land|land acquisition|land pooling|special economic zones?|land grab\w*|urban expansion|urban (frontiers?|edges?)|land speculation|land markets?|land conversion|urbani[sz]ing villages?', 'urban|city|cities|municipal|metropol\w*|towns?\b']
      flag: ['\b(soil|crop yields?|remote sensing|land surface temperature|ndvi|landsat|cellular automata)\b']
  A6:
    domain: A
    name: Small towns, census towns & secondary cities
    queries:
      - '("small towns" OR "small town") AND (urban OR urbanisation OR urbanization)'
      - '"census towns" OR "census town"'
      - '"secondary cities" OR "secondary city" OR "intermediate cities" OR "medium-sized cities" OR "second-tier cities"'
      - '"subaltern urbanization" OR "subaltern urbanisation" OR "small and medium towns"'
    screen:
      # v3 (Stage 2)
      require: ['small towns?|census towns?|secondary cit\w*|intermediate cit\w*|medium-sized (cit\w*|towns?)|second-tier cit\w*|tier-?(2|ii|3|iii) cit\w*|subaltern urbani[sz]ation|small and medium(-sized)? (towns?|cit\w*)|small cit(y|ies)|small urban (centres?|centers?)']
      flag: []
  A7:
    domain: A
    name: Urban infrastructure (water, sanitation, energy) & infrastructural citizenship
    queries:
      - '"urban water" AND (governance OR politics OR access OR supply OR inequality)'
      - 'sanitation AND (urban OR city OR slum) AND (politics OR governance OR access)'
      - '"infrastructural citizenship" OR "hydraulic citizenship" OR "infrastructural violence" OR "splintering urbanism"'
      - '"urban infrastructure" AND (politics OR governance OR everyday OR citizenship)'
      - '(electricity OR "energy access") AND (slum OR "informal settlement" OR urban poor)'
    screen:
      # v3 (Stage 2)
      require: ['water (supply|access|governance|politics|infrastructures?|utilit\w*|provision|services?|pipes?|tankers?)|urban water|sanitation|toilets?|sewer\w*|sewage|drainage|electri\w*|energy access|infrastructur\w*|hydraulic citizenship|splintering urbanism|solid waste|waste management', 'urban|city|cities|municipal|metropol\w*|towns?\b|slums?|informal settlements?']
      flag: ['\b(wastewater treatment plant|membrane|pipe network model|hydraulic model\w*|water quality index|heavy metals?|physicochemical|pathogens?|e\. coli|photovoltaic|load forecasting|power flow|smart grid)\b']
  A8:
    domain: A
    name: Mobility & transport (social science)
    queries:
      - '"urban mobility" AND (social OR equity OR justice OR everyday OR politics)'
      - '"transport equity" OR "transport justice" OR "transport disadvantage" OR "mobility justice" OR "transport poverty"'
      - '"public transport" AND (gender OR women OR informal OR everyday OR politics)'
      - 'paratransit OR "informal transport" OR "auto-rickshaw" OR "minibus taxi" OR matatu'
      - '"mobilities" AND (urban OR city) AND (social OR everyday)'
    screen:
      # v3 (Stage 2)
      require: ['urban mobilit\w*|mobility justice|transport(ation)? (equity|justice|disadvantage|poverty|polic\w*|planning|inequalit\w*|exclusion)|public (transport|transit)|mass transit|paratransit|informal transport|auto-?rickshaws?|rickshaws?|minibus\w*|matatus?|commut\w*|buses\b|bus (services?|rapid transit|routes?)|\bbrt\b|metro (rail|systems?|lines?)|walking|cycling|daily mobilit\w*|everyday mobilit\w*|mobilities|accessibility to (jobs|opportunities)', 'urban|city|cities|municipal|metropol\w*|towns?\b|street']
      flag: ['\b(traffic flow|vehicle routing|optimi[sz]ation model|signal control|demand forecasting|traffic simulation|emission model\w*|crash|injur\w*)\b']
  A9:
    domain: A
    name: Public space, publicness & the street
    # v2 (pilot): bare "publicness" and "the street" pulled in public-management and generic
    # sociology works (67k hits); both now need a spatial/urban co-term.
    queries:
      - '("public space" OR "public spaces") AND (urban OR city OR cities OR street OR streets)'
      - '"urban publicness" OR (publicness AND ("public space" OR "public spaces" OR urban OR city))'
      - '"everyday urbanism" OR ("street life" AND (urban OR city)) OR (sidewalk AND "public space")'
      - '"privatization of public space" OR "privatisation of public space" OR "privately owned public space" OR "privately owned public spaces" OR "pseudo-public"'
      - '"right to the city" AND ("public space" OR street OR streets)'
    screen:
      require: ['public spaces?|publicness|public realm|public life|street life|everyday urbanism|privately owned public|pseudo-public|sidewalks?|right to the city|streets? as', 'urban|city|cities|street|neighbou?rhood|town']
      flag: ['\b(thermal comfort|microclimate|air quality|pm2\.5|noise level|obesity|physical activity)\b']
  A10:
    domain: A
    name: Urban economy, informal work & street vending
    queries:
      - '"street vending" OR "street vendors" OR "street hawkers" OR hawkers OR "street trading"'
      - '"informal economy" AND (urban OR city OR cities)'
      - '"informal sector" AND urban AND (workers OR livelihoods OR employment)'
      - '"waste pickers" OR "home-based workers" OR "informal workers" AND city'
      - '"urban informal economy" OR "urban livelihoods"'
    screen:
      # v3 (Stage 2)
      require: ['street vend\w*|street hawk\w*|hawkers?|street trad\w*|informal (economy|sector|work\w*|employment|traders?|enterprises?|livelihoods?)|waste pickers?|home-based work\w*|urban livelihoods?', 'urban|city|cities|municipal|metropol\w*|towns?\b|street']
      flag: []
  A11:
    domain: A
    name: Migration & the city
    queries:
      - '"rural-urban migration" OR "rural–urban migration" OR "internal migration" AND (city OR urban)'
      - '"urban migrants" OR "migrant workers" AND (city OR urban)'
      - '("circular migration" OR "seasonal migration") AND (urban OR city)'
      - '"urban refugees" OR "arrival city" OR "arrival cities" OR "migrant city"'
    screen:
      # v3 (Stage 2)
      require: ['migra\w*|refugee\w*|arrival cit\w*|newcomers?|displaced', 'urban|city|cities|municipal|metropol\w*|towns?\b']
      flag: ['\b(cell migration|ion migration|metastas\w*|birds?|species|larva\w*|seed dispersal|bird migration|migration of (ions|cells))\b']
  A12:
    domain: A
    name: Gender, caste, class & the city
    queries:
      - '"feminist urbanism" OR "gendered city" OR "women and the city" OR "feminist geography" AND city'
      - '("women''s safety" OR "sexual harassment") AND (urban OR city OR "public transport" OR street)'
      - 'caste AND (urban OR city OR cities)'
      - '("residential segregation" OR "spatial segregation") AND (class OR caste OR religion OR Muslim)'
      - '"urban middle class" OR "new middle class" AND city'
    screen:
      # v3 (Stage 2)
      require: ['gender\w*|women|feminis\w*|caste\w*|dalits?|(middle|working)[- ]class\w*|class (relations|formation|identit\w*|divides?|inequalit\w*)|segregat\w*|muslims?|sexual harassment|women.s safety', 'urban|city|cities|municipal|metropol\w*|towns?\b|streets?|neighbou?rhoods?|public spaces?']
      flag: []
  A13:
    domain: A
    name: Heritage, mega-events & "world-class" city making
    queries:
      - '"mega-events" OR "mega-event" OR "Commonwealth Games" OR "Olympic Games" AND (city OR urban)'
      - '"world-class city" OR "world class city" OR "worlding cities" OR "global city making"'
      - '"urban heritage" OR heritagization OR heritagisation OR "heritage conservation" AND city'
      - '"urban beautification" OR "city branding" OR "urban spectacle" OR "urban renewal" AND spectacle'
    screen:
      # v3 (Stage 2)
      require: ['mega-?events?|olympic\w*|commonwealth games|world cups?|world[- ]class cit\w*|worlding|urban heritage|heritage (conservation|cit\w*|zones?|management|tourism|sites?|precincts?|walks?)|heritagi[sz]ation|beautif\w*|city branding|place branding|urban spectacle|urban renewal|global city', 'urban|city|cities|municipal|metropol\w*|towns?\b']
      flag: ['\b(laser scanning|photogrammetry|hbim|point clouds?|seismic retrofit\w*|mortar|masonry)\b']
  A14:
    domain: A
    name: Urban environment, climate & risk
    queries:
      - '"urban climate governance" OR ("climate change" AND (city OR cities) AND (adaptation OR governance OR justice))'
      - '"urban resilience"'
      - '("urban flooding" OR "urban floods") AND (governance OR vulnerability OR politics)'
      - '"urban political ecology"'
      - '"urban heat" AND (vulnerability OR justice OR inequality)'
    screen:
      # v3 (Stage 2)
      require: ['climate (change|adaptation|governance|justice|action|risks?|mitigation|plans?)|urban resilience|resilien\w*|flood\w*|urban heat|heat ?waves?|heat islands?|political ecology|disaster risk\w*|environmental (justice|governance)|vulnerabilit\w*', 'urban|city|cities|municipal|metropol\w*|towns?\b']
      flag: ['\b(remote sensing|land surface temperature|landsat|hydrological model\w*|swmm|hydrodynamic|wrf model|cfd|machine learning model)\b']
  A15:
    domain: A
    name: Urban & planning theory, Southern urbanism
    queries:
      - '"southern urbanism" OR "southern urban theory" OR "urban theory from the South" OR "ordinary cities"'
      - '"comparative urbanism" OR "postcolonial urbanism" OR "postcolonial urban"'
      - '"planning theory" OR "insurgent planning" OR "occupancy urbanism"'
      - '"urban theory" AND (global OR south OR critique)'
    screen:
      # v3 (Stage 2)
      require: ['southern urban\w*|urban theor\w*|planning theor\w*|comparative urbanism|comparative urban\w* (research|studies|theory)|postcolonial urban\w*|ordinary cit\w*|insurgent planning|occupancy urbanism|theori[sz]\w* (the )?(urban|cit\w*)|southern theor\w*|subaltern urbanism|global (south|southern) (cit\w*|urbanism)|planetary urbani[sz]ation|urban studies']
      flag: []
  A16:
    domain: A
    name: Night-time city & urban time
    queries:
      - '("night-time economy" OR "nighttime economy" OR "night-time city" OR "urban night" OR nightlife) NOT ("nighttime light" OR "night-time light" OR "night light")'
      - '"urban rhythms" OR rhythmanalysis OR "urban time" OR "urban temporalities"'
      - '(night OR nighttime OR "after dark") AND (women OR safety OR mobility) AND (city OR street OR transport) NOT ("nighttime light" OR "night-time light")'
    screen:
      # v3 (Stage 2)
      require: ['night\w*|nocturnal|after dark|urban rhythms?|rhythmanalys\w*|urban times?\b|temporalit\w*|chronotop\w*|24-hour cit\w*', 'urban|city|cities|municipal|metropol\w*|towns?\b|streets?|transport|transit']
      flag: ['night-?time lights?|night lights?|luminosity|viirs|dmsp|sleep\w*|nocturia|light pollution|nighttime light']

  # ------------------------------------------------------------------ B. Digital society
  B1:
    domain: B
    name: Platforms & platform capitalism
    queries:
      - '"platform capitalism" OR "platform economy" OR "platform society"'
      - 'platformization OR platformisation'
      - '"digital platforms" AND (power OR governance OR capitalism OR regulation OR monopoly)'
    screen:
      # v3 (Stage 2)
      require: ['platform capitalism|platform econom\w*|platform society|platformi[sz]\w*|digital platforms?|platform (power|governance|regulation|companies|firms|ecosystems?|monopol\w*|labou?r|work)|big tech']
      flag: ['\b(platform trials?|drug delivery|biomarker|sequencing platform|technology platform for|proteomic)\b']
  B2:
    domain: B
    name: Datafication, data justice & data colonialism
    queries:
      - 'datafication'
      - '"data justice"'
      - '"data colonialism" OR "digital colonialism" OR "data extractivism"'
      - '"surveillance capitalism" OR "critical data studies"'
    screen:
      # v3 (Stage 2)
      require: ['datafi\w*|data justice|data colonialism|digital colonialism|data extractiv\w*|surveillance capitalism|critical data studies|data activism|big data (and|&) society']
      flag: []
      # v3b: borderline was 26%; a single core mention must be in the opening/aim sentences
      strict_once: true
  B3:
    domain: B
    name: Surveillance studies
    queries:
      # v3: bare "surveillance studies" also matched epidemiological surveillance studies
      - '("surveillance studies" AND (privacy OR power OR digital OR state OR police OR policing)) OR "surveillance society" OR "surveillant assemblage"'
      - 'dataveillance OR "lateral surveillance" OR "social sorting" OR "state surveillance" OR "mass surveillance"'
      - 'surveillance AND privacy AND (digital OR technology) AND (power OR state OR citizens)'
    screen:
      # v3 (Stage 2)
      require: ['surveil\w*|dataveillance|social sorting|panoptic\w*']
      flag: ['\b(disease surveillance|epidemiolog\w*|syndromic|public health surveillance|sentinel|genomic surveillance|wastewater surveillance|antimicrobial|serosurvey|surveillance system for (influenza|covid))\b']
  B4:
    domain: B
    name: Algorithmic governance & AI in the public sector
    queries:
      - '"algorithmic governance" OR "algorithmic governmentality" OR "algorithmic regulation"'
      - '"automated decision-making" OR "automated decision making" AND (government OR public OR welfare)'
      - '"artificial intelligence" AND ("public sector" OR "public administration" OR "public services")'
      - '"digital welfare state" OR "algorithmic accountability"'
    screen:
      # v3 (Stage 2)
      require: ['algorithmic (governance|governmentality|regulation|decision\w*|accountability|management|bureaucra\w*|state)|automated decision\w*|artificial intelligence|\bai\b|machine learning|digital welfare state|algorithms?\b|automation', 'govern\w*|public (sector|administration|services?|polic\w*|authorit\w*|management)|welfare|state\b|bureaucra\w*|polic(y|ies)']
      flag: []
  B5:
    domain: B
    name: Digital identity & digital public infrastructure (DPI)
    # v2 (pilot): v1 matched "state" in "state of the art" and bare "development", pulling in
    # biometrics engineering and DNA barcoding (12k hits, ~5/50 relevant in the top 50).
    # Co-terms are now policy-specific phrases; "national identification" and "legal identity"
    # dropped (they match national-identity psychology and legal theory).
    queries:
      - 'Aadhaar OR "India Stack" OR "digital public infrastructure" OR "digital public goods" OR "Unique Identification Authority" OR "identification for development" OR ID4D'
      - '("digital identity" OR "digital ID" OR "digital identification" OR "national ID" OR "national identity card" OR "national identity cards" OR "foundational ID" OR "identity cards" OR "ID cards" OR "identity documents") AND (citizenship OR welfare OR "social protection" OR surveillance OR "public services" OR "financial inclusion" OR government)'
      - '("biometric identification" OR "biometric registration" OR "biometric ID" OR "biometric authentication" OR biometrics) AND (citizenship OR "social protection" OR "public distribution system" OR welfare OR "cash transfers" OR "state capacity" OR "voter registration" OR NREGA OR MGNREGA OR pensions)'
    screen:
      require: ['aadhaar|\buid\b|unique identi\w+|digital id\w*|digital identit\w*|national id\w*|identity cards?|\bid cards?|identity documents?|identification (systems?|cards?|numbers?|documents?|programmes?|programs?|projects?)|biometric\w*|digital public (infrastructure|goods)|india stack|id4d|identification for development|self-sovereign identit\w*', 'state|citizen\w*|welfare|government|public|polic\w*|social protection|surveillance|governance|inclusion|exclusion|rights?|india|migra\w*|border']
      flag: ['\b(fingerprint recognition|iris recognition|finger-?vein|palmprint|gait recognition|liveness detection|presentation attack|zero-knowledge|blockchain-based|forensic odontology|denture)\b']
  B6:
    domain: B
    name: Digital finance & payments
    queries:
      - '"mobile money" OR M-Pesa OR MPesa'
      - '"digital payments" OR "digital payment" OR cashless OR demonetisation OR demonetization'
      - '"financial inclusion" AND (digital OR mobile OR fintech)'
      - 'fintech AND (inclusion OR society OR regulation OR households OR poor)'
