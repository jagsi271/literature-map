    name: Urban surveillance, policing & biometrics in public space
    queries:
      - '"urban surveillance" OR (surveillance AND (city OR cities) AND (policing OR "public space"))'
      - '(CCTV OR "video surveillance" OR "closed-circuit television") AND (city OR urban OR "public space")'
      - '"facial recognition" AND (police OR policing OR "public space" OR city)'
      - '"predictive policing" OR "smart policing" OR "safe city"'
    screen:
      require: ['surveil|cctv|camera|facial recognition|policing|police|biometric|safe cit']
      flag: ['\b(object detection|yolo|person re-identification|tracking algorithm)\b']
  C7:
